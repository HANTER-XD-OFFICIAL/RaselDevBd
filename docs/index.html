<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rasel Dev BD — React + Headless CMS (Contentful & Strapi) Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#090E1A] text-slate-100 antialiased">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const CMS_KEY = 'rasel_dev_bd_headless_cms_config_v2';

    function App() {
      const [bundle, setBundle] = useState(null);
      const [items, setItems] = useState([]);
      const [activeTab, setActiveTab] = useState('ALL');
      const [cmsModal, setCmsModal] = useState(false);
      const [postModal, setPostModal] = useState(false);
      const [status, setStatus] = useState('Contentful & Strapi Headless CMS Ready');
      const [cms, setCms] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem(CMS_KEY)) || {
            provider: 'CONTENTFUL',
            contentfulSpaceId: '',
            contentfulEnvironment: 'master',
            contentfulDeliveryToken: '',
            contentfulManagementToken: '',
            strapiBaseUrl: 'https://cms.raseldevbd.com',
            strapiApiToken: ''
          };
        } catch (_) {
          return { provider: 'CONTENTFUL', contentfulSpaceId: '', contentfulEnvironment: 'master' };
        }
      });

      const [draft, setDraft] = useState({
        title: '',
        contentType: 'BLOG',
        categoryName: 'React & Headless CMS',
        summary: '',
        markdownBody: '',
        photoCaption: ''
      });

      useEffect(() => {
        fetch('./data/content-bundle.json')
          .then((r) => r.json())
          .then((data) => {
            setBundle(data);
            setItems(data.items || []);
          })
          .catch(() => {});
      }, []);

      async function syncHeadlessCms() {
        try {
          if (cms.provider === 'STRAPI') {
            const base = (cms.strapiBaseUrl || '').replace(/\/+$/, '');
            const res = await fetch(`${base}/api/portfolio-items?populate=*`, {
              headers: cms.strapiApiToken ? { Authorization: `Bearer ${cms.strapiApiToken}` } : {}
            });
            if (!res.ok) throw new Error(`Strapi HTTP ${res.status}`);
            const json = await res.json();
            const mapped = (json.data || []).map((d, idx) => {
              const a = d.attributes || d;
              return {
                id: d.id || idx,
                title: a.title,
                contentType: a.contentType || 'BLOG',
                categoryName: a.categoryName || 'React & Headless CMS',
                summary: a.summary || '',
                markdownBody: a.markdownBody || '',
                photoCaption: a.photoCaption || '',
                cmsProvider: 'STRAPI'
              };
            });
            if (mapped.length) setItems(mapped);
            setStatus(`Synced ${mapped.length} live items from Strapi`);
          } else {
            const url = `https://cdn.contentful.com/spaces/${cms.contentfulSpaceId}/environments/${cms.contentfulEnvironment || 'master'}/entries?access_token=${cms.contentfulDeliveryToken}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`Contentful HTTP ${res.status}`);
            const json = await res.json();
            const mapped = (json.items || []).map((e, idx) => ({
              id: e.sys?.id || idx,
              title: e.fields?.title || 'Untitled',
              contentType: e.fields?.contentType || 'BLOG',
              categoryName: e.fields?.categoryName || 'React & Headless CMS',
              summary: e.fields?.summary || '',
              markdownBody: e.fields?.markdownBody || '',
              photoCaption: e.fields?.photoCaption || '',
              cmsProvider: 'CONTENTFUL'
            }));
            if (mapped.length) setItems(mapped);
            setStatus(`Synced ${mapped.length} live items from Contentful`);
          }
        } catch (err) {
          setStatus(`CMS Notice: ${err.message}`);
        }
      }

      const visible = items.filter((i) => activeTab === 'ALL' || i.contentType === activeTab);

      return (
        <div className="min-h-screen bg-[#090E1A] text-slate-100">
          <header className="border-b border-slate-800 bg-[#090E1A]/90 sticky top-0 z-20">
            <div className="max-w-6xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
              <div>
                <div className="text-xs font-mono text-emerald-400">{status}</div>
                <h1 className="text-xl font-bold text-white">Rasel Dev BD • Headless CMS Portfolio</h1>
              </div>
              <div className="flex gap-2">
                <button onClick={syncHeadlessCms} className="px-3 py-2 rounded-lg border border-slate-700 text-xs font-mono text-cyan-300">
                  ↻ Sync {cms.provider}
                </button>
                <button onClick={() => setCmsModal(true)} className="px-3 py-2 rounded-lg border border-emerald-500/40 text-xs font-mono text-emerald-300">
                  CMS Settings
                </button>
                <button onClick={() => setPostModal(true)} className="px-4 py-2 rounded-lg bg-emerald-500 text-slate-950 font-bold text-xs">
                  + Post Without Code
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-8">
            <div className="flex gap-2 mb-6">
              {['ALL', 'PROJECT', 'BLOG', 'PHOTO'].map((t) => (
                <button
                  key={t}
                  onClick={() => setActiveTab(t)}
                  className={`px-4 py-2 rounded-xl text-xs font-mono ${activeTab === t ? 'bg-emerald-500 text-slate-950 font-bold' : 'bg-slate-900 text-slate-300'}`}
                >
                  {t}
                </button>
              ))}
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
              {visible.map((item, idx) => (
                <article key={item.id || idx} className="p-5 rounded-2xl bg-[#111827] border border-slate-800">
                  <div className="text-xs font-mono text-emerald-400 mb-1">
                    {item.contentType} • {item.categoryName} {item.cmsProvider ? `• ${item.cmsProvider}` : ''}
                  </div>
                  <h2 className="text-lg font-bold text-white mb-2">{item.title}</h2>
                  <p className="text-sm text-slate-300">{item.summary}</p>
                </article>
              ))}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
