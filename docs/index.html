        extend: {

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#090E1A] text-slate-100 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STORAGE_KEY = 'rasel_dev_bd_static_cms_v1';

    const FALLBACK_BUNDLE = {
      schemaVersion: "1.0.0",
      siteConfig: {
        siteTitle: "Rasel Dev BD",
        tagline: "Full-Stack React & Android Architect • Building Cloud-Native Products from Dhaka",
        bio: "Hi, I'm Rasel — a full-stack engineer and open-source creator based in Dhaka, Bangladesh. I specialize in React 19 static/SSR architectures, TypeScript design systems, and native Android apps with Jetpack Compose.",
        githubUsername: "rasel-dev-bd",
        githubPagesDomain: "https://rasel-dev-bd.github.io",
        email: "alexraselchodhury@gmail.com",
        location: "Dhaka, Bangladesh 🇧🇩",
        adminPasscode: "2026",
        skills: ["React 19", "TypeScript", "Next.js", "Tailwind CSS", "Kotlin", "Jetpack Compose", "Node.js", "PostgreSQL", "GitHub Actions", "Docker"]
      },
      categories: [
        { id: 1, name: "React & Static Web", slug: "react-static-web", contentTypeScope: "ALL", colorHex: "#10B981", description: "React 19, Vite, Next.js, and GitHub Pages static site architectures." },
        { id: 2, name: "Android & Kotlin", slug: "android-kotlin", contentTypeScope: "ALL", colorHex: "#06B6D4", description: "Jetpack Compose, Room offline-first databases, and Material 3 apps." },
        { id: 3, name: "Cloud & DevOps", slug: "cloud-devops", contentTypeScope: "ALL", colorHex: "#8B5CF6", description: "GitHub Actions CI/CD, Docker containers, edge functions, and telemetry." },
        { id: 4, name: "Dhaka Tech & Street", slug: "dhaka-tech-street", contentTypeScope: "PHOTO", colorHex: "#F59E0B", description: "Visual stories, twilight architecture, and developer life across Bangladesh." },
        { id: 5, name: "System Architecture", slug: "system-architecture", contentTypeScope: "BLOG", colorHex: "#F43F5E", description: "Deep-dive engineering notes on scalability, state synchronization, and UI performance." }
      ],
      contentItems: [
        {
          id: 101,
          contentType: "PROJECT",
          title: "Rasel Dev BD — Static CMS & GitHub Pages Engine",
          slug: "rasel-dev-bd-static-cms",
          summaryOrCaption: "Zero-backend React 19 + GitHub Pages portfolio and content platform with automated JSON bundle generation, dynamic category routing, and offline-first authoring.",
          bodyMarkdown: "## Overview\n**Rasel Dev BD Static CMS** bridges local content authoring with zero-cost static hosting on GitHub Pages (`rasel-dev-bd.github.io`).\n\n### Key Engineering Highlights\n- **Dynamic Category Taxonomy**: Manage unified or scoped categories across Projects, Blog Articles, and Photo Galleries.\n- **Deterministic Static JSON Bundle**: Compiles all published entries into `content-bundle.json`.\n\n```tsx\nexport async function loadPortfolioBundle() {\n  const res = await fetch('./data/content-bundle.json');\n  return await res.json();\n}\n```",
          categoryId: 1,
          categoryName: "React & Static Web",
          staticAssetPath: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=1200&q=80",
          tags: ["React 19", "TypeScript", "Vite", "GitHub Pages", "Tailwind CSS"],
          liveUrl: "https://rasel-dev-bd.github.io",
          repoUrl: "https://github.com/rasel-dev-bd/rasel-dev-bd.github.io",
          isFeatured: true,
          isPublished: true,
          likesCount: 128,
          publishedDateIso: "2026-09-25"
        },
        {
          id: 201,
          contentType: "BLOG",
          title: "Architecting a Static-First React CMS for GitHub Pages Without a Backend Server",
          slug: "static-first-react-cms-github-pages",
          summaryOrCaption: "How to combine an offline-capable Admin Dashboard with deterministic JSON asset generation so your portfolio scales to 100k+ views for $0/month.",
          bodyMarkdown: "## Why Static Site Generation Still Wins\nWhen hosting on **GitHub Pages**, you don't have a runtime Node.js server or SQL database executing on every request. Yet developers still want a rich **Admin Dashboard** to organize dynamic categories, write markdown blog posts, and upload project & photo galleries.\n\n```json\n{\n  \"site\": \"Rasel Dev BD\",\n  \"categories\": [\"react-static-web\", \"android-kotlin\"]\n}\n```",
          categoryId: 1,
          categoryName: "React & Static Web",
          staticAssetPath: "https://images.unsplash.com/photo-1461749280684-dccba630e2f6?auto=format&fit=crop&w=1200&q=80",
          tags: ["React", "GitHub Pages", "SSG", "CMS"],
          liveUrl: "6 min read",
          repoUrl: "/blog/static-first-react-cms-github-pages",
          isFeatured: true,
          isPublished: true,
          likesCount: 142,
          publishedDateIso: "2026-09-26"
        },
        {
          id: 301,
          contentType: "PHOTO",
          title: "Blue Hour Reflections Over Hatirjheel",
          slug: "blue-hour-hatirjheel-dhaka",
          summaryOrCaption: "Captured just 20 minutes after sunset as the curved bridges of Hatirjheel lit up in neon cyan and emerald against Dhaka's twilight sky.",
          bodyMarkdown: "### Behind the Shot\nCaptured from the Hatirjheel overpass in Dhaka, Bangladesh.\n\n- **Location**: Hatirjheel, Dhaka\n- **Camera**: Sony A7 IV • 24mm f/1.4 GM",
          categoryId: 4,
          categoryName: "Dhaka Tech & Street",
          staticAssetPath: "https://images.unsplash.com/photo-1596895111956-bf1cf0599ce5?auto=format&fit=crop&w=1200&q=80",
          tags: ["Dhaka", "Hatirjheel", "Twilight", "Bangladesh"],
          liveUrl: "Hatirjheel, Dhaka 🇧🇩",
          repoUrl: "24mm • f/5.6 • 2.5s • ISO 200",
          isFeatured: true,
          isPublished: true,
          likesCount: 215,
          publishedDateIso: "2026-09-24"
        }
      ]
    };

    function toSlug(str) {
      return (str || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '') || ('item-' + Date.now());
    }

    function MarkdownBlocks({ markdown }) {
      const segments = (markdown || '').split('```');
      return (
        <div className="space-y-4">
          {segments.map((seg, idx) => {
            if (idx % 2 === 1) {
              const lines = seg.trim().split('\n');
              const lang = lines[0] && lines[0].length < 16 && !lines[0].includes(' ') ? lines[0] : 'code';
              const code = lang !== 'code' ? lines.slice(1).join('\n') : seg.trim();
              return (
                <div key={idx} className="rounded-xl bg-[#050811] border border-slate-800 p-4 overflow-x-auto">
                  <div className="text-[11px] font-mono text-emerald-400 uppercase mb-2">{lang}</div>
                  <pre className="text-xs font-mono text-slate-200 leading-relaxed">{code}</pre>
                </div>
              );
            }
            return seg.trim().split('\n\n').filter(Boolean).map((p, pIdx) => {
              const t = p.trim();
              if (t.startsWith('## ')) {
                return <h3 key={pIdx} className="text-xl font-display font-bold text-emerald-400 pt-2">{t.replace('## ', '')}</h3>;
              }
              if (t.startsWith('### ')) {
                return <h4 key={pIdx} className="text-base font-display font-bold text-white pt-1">{t.replace('### ', '')}</h4>;
              }
              return <p key={pIdx} className="text-slate-300 leading-relaxed whitespace-pre-line">{t}</p>;
            });
          })}
        </div>
      );
    }

    function RaselDevBDWebsite() {
      const [siteConfig, setSiteConfig] = useState(FALLBACK_BUNDLE.siteConfig);
      const [categories, setCategories] = useState(FALLBACK_BUNDLE.categories);
      const [items, setItems] = useState(FALLBACK_BUNDLE.contentItems);
      const [activeNav, setActiveNav] = useState('HOME'); // HOME | PROJECT | BLOG | PHOTO | ADMIN
      const [selectedCategoryId, setSelectedCategoryId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [detailItem, setDetailItem] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);

      // Admin state
      const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [adminTab, setAdminTab] = useState('CONTENT'); // CONTENT | CATEGORIES | SSG | SETTINGS
      const [editingItem, setEditingItem] = useState(null);
      const [editingCategory, setEditingCategory] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3800);
      };

      // Load from localStorage or ./data/content-bundle.json
      useEffect(() => {
        const cached = localStorage.getItem(STORAGE_KEY);
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (parsed.siteConfig) setSiteConfig({ adminPasscode: '2026', ...parsed.siteConfig });
            if (Array.isArray(parsed.categories)) setCategories(parsed.categories);
            if (Array.isArray(parsed.contentItems)) setItems(parsed.contentItems);
            return;
          } catch (e) {}
        }
        fetch('./data/content-bundle.json')
          .then((r) => r.json())
          .then((data) => {
            if (data.siteConfig) setSiteConfig({ adminPasscode: '2026', ...data.siteConfig });
            if (Array.isArray(data.categories)) setCategories(data.categories);
            if (Array.isArray(data.contentItems)) setItems(data.contentItems);
          })
          .catch(() => {});
      }, []);

      const persistToStorage = (nextConfig, nextCategories, nextItems) => {
        const payload = {
          schemaVersion: "1.0.0",
          generatedAt: new Date().toISOString(),
          siteConfig: nextConfig,
          categories: nextCategories,
          contentItems: nextItems
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(payload, null, 2));
      };

      const publishedItems = useMemo(() => items.filter((i) => i.isPublished !== false), [items]);

      const filteredItems = useMemo(() => {
        return publishedItems.filter((item) => {
          const matchesType = activeNav === 'HOME' || activeNav === 'ADMIN' || item.contentType === activeNav;
          const matchesCat = selectedCategoryId === null || Number(item.categoryId) === Number(selectedCategoryId);
          const q = searchQuery.toLowerCase();
          const matchesQuery = !q ||
            (item.title || '').toLowerCase().includes(q) ||
            (item.summaryOrCaption || '').toLowerCase().includes(q) ||
            (item.categoryName || '').toLowerCase().includes(q) ||
            (item.tags || []).some((t) => t.toLowerCase().includes(q));
          return matchesType && matchesCat && matchesQuery;
        });
      }, [publishedItems, activeNav, selectedCategoryId, searchQuery]);

      const handleLike = (id, e) => {
        if (e) e.stopPropagation();
        const next = items.map((item) => item.id === id ? { ...item, likesCount: (item.likesCount || 0) + 1 } : item);
        setItems(next);
        if (detailItem && detailItem.id === id) {
          setDetailItem({ ...detailItem, likesCount: (detailItem.likesCount || 0) + 1 });
        }
        persistToStorage(siteConfig, categories, next);
      };

      const handleDownloadStaticBundle = () => {
        const bundleObj = {
          schemaVersion: "1.0.0",
          generator: "Rasel Dev BD Static Site Engine (GitHub Pages Compatible)",
          generatedAt: new Date().toISOString(),
          siteConfig,
          categories,
          contentItems: publishedItems
        };
        const blob = new Blob([JSON.stringify(bundleObj, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'content-bundle.json';
        a.click();
        URL.revokeObjectURL(url);
        showToast('Downloaded content-bundle.json for GitHub Pages!');
      };

      const handleSaveContentItem = (e) => {
        e.preventDefault();
        const catObj = categories.find((c) => Number(c.id) === Number(editingItem.categoryId)) || categories[0];
        const finalItem = {
          ...editingItem,
          id: editingItem.id || Date.now(),
          slug: toSlug(editingItem.slug || editingItem.title),
          categoryId: catObj ? catObj.id : 1,
          categoryName: catObj ? catObj.name : 'General',
          tags: typeof editingItem.tags === 'string'
            ? editingItem.tags.split(',').map((t) => t.trim()).filter(Boolean)
            : (editingItem.tags || []),
          publishedDateIso: editingItem.publishedDateIso || new Date().toISOString().slice(0, 10)
        };
        const exists = items.some((i) => i.id === finalItem.id);
        const next = exists ? items.map((i) => i.id === finalItem.id ? finalItem : i) : [finalItem, ...items];
        setItems(next);
        persistToStorage(siteConfig, categories, next);
        setEditingItem(null);
        showToast(`Saved "${finalItem.title}" (${finalItem.contentType})`);
      };

      const handleSaveCategory = (e) => {
        e.preventDefault();
        const finalCat = {
          ...editingCategory,
          id: editingCategory.id || Date.now(),
          slug: toSlug(editingCategory.slug || editingCategory.name)
        };
        const exists = categories.some((c) => c.id === finalCat.id);
        const nextCats = exists ? categories.map((c) => c.id === finalCat.id ? finalCat : c) : [...categories, finalCat];
        const nextItems = items.map((item) => Number(item.categoryId) === Number(finalCat.id) ? { ...item, categoryName: finalCat.name } : item);
        setCategories(nextCats);
        setItems(nextItems);
        persistToStorage(siteConfig, nextCats, nextItems);
        setEditingCategory(null);
        showToast(`Saved category "${finalCat.name}"`);
      };

      const handlePhotoUploadFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          setEditingItem({ ...editingItem, staticAssetPath: reader.result, mediaSource: reader.result });
          showToast('Uploaded image converted for static hosting!');
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="min-h-screen flex flex-col bg-[#090E1A] text-slate-100">
          {/* Top Sticky Navigation */}
          <header className="sticky top-0 z-30 border-b border-slate-800/80 bg-[#090E1A]/90 backdrop-blur-md">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div
                onClick={() => { setActiveNav('HOME'); setDetailItem(null); }}
                className="flex items-center gap-3 cursor-pointer"
              >
                <span className="px-2.5 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/50 text-emerald-400 font-mono font-bold text-sm">
                  &lt;R/&gt;
                </span>
                <div>
                  <h1 className="font-display font-bold text-lg tracking-tight text-white">{siteConfig.siteTitle}</h1>
                  <p className="text-[11px] font-mono text-emerald-400">
                    {isAdminUnlocked ? 'Admin Studio Unlocked • SSG Ready' : 'Developer Portfolio & Content Platform'}
                  </p>
                </div>
              </div>

              <nav className="flex items-center gap-1.5 flex-wrap">
                {[
                  { id: 'HOME', label: 'Portfolio' },
                  { id: 'PROJECT', label: 'Projects' },
                  { id: 'BLOG', label: 'Blog' },
                  { id: 'PHOTO', label: 'Photos' },
                  { id: 'ADMIN', label: isAdminUnlocked ? 'Admin Studio (Unlocked)' : 'Admin Dashboard' }
                ].map((tab) => (
                  <button
                    key={tab.id}
                    onClick={() => { setActiveNav(tab.id); setDetailItem(null); }}
                    className={`px-3.5 py-2 rounded-xl text-xs font-mono transition ${
                      activeNav === tab.id
                        ? 'bg-emerald-500 text-slate-950 font-bold shadow-lg shadow-emerald-500/20'
                        : 'bg-slate-900 text-slate-300 hover:bg-slate-800 border border-slate-800'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
            {detailItem ? (
              <div className="max-w-3xl mx-auto bg-[#111827] border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
                <div className="relative h-72 sm:h-96 bg-slate-900">
                  <img
                    src={detailItem.staticAssetPath || detailItem.mediaSource}
                    alt={detailItem.title}
                    className="w-full h-full object-cover"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-[#090E1A] via-[#090E1A]/40 to-transparent" />
                  <button
                    onClick={() => setDetailItem(null)}
                    className="absolute top-4 left-4 px-4 py-2 rounded-xl bg-slate-950/80 border border-slate-700 text-xs font-mono text-white hover:border-emerald-400"
                  >
                    ← Back to {activeNav === 'HOME' ? 'Portfolio' : activeNav}
                  </button>
                  <div className="absolute bottom-5 left-6 right-6">
                    <div className="flex items-center gap-2 mb-2">
                      <span className="px-2.5 py-1 rounded-md bg-emerald-500/20 border border-emerald-500/50 text-emerald-300 font-mono text-xs font-bold">
                        {detailItem.contentType}
                      </span>
                      <span className="px-2.5 py-1 rounded-md bg-slate-900/80 border border-slate-700 text-cyan-300 font-mono text-xs">
                        {detailItem.categoryName}
                      </span>
                    </div>
                    <h2 className="text-2xl sm:text-3xl font-display font-bold text-white">{detailItem.title}</h2>
                  </div>
                </div>

                <div className="p-6 sm:p-8 space-y-6">
                  <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
                    <div className="text-xs font-mono text-slate-400">
                      Published {(detailItem.publishedDateIso || '').slice(0, 10)} • /{detailItem.contentType.toLowerCase()}/{detailItem.slug}
                    </div>
                    <button
                      onClick={(e) => handleLike(detailItem.id, e)}
                      className="px-4 py-2 rounded-xl bg-rose-500/15 border border-rose-500/40 text-rose-300 text-xs font-mono font-bold hover:bg-rose-500/25"
                    >
                      ♥ {detailItem.likesCount || 0} Appreciations
                    </button>
                  </div>

                  <div className="p-4 rounded-2xl bg-slate-900/90 border border-emerald-500/30">
                    <div className="text-[11px] font-mono text-emerald-400 uppercase font-bold mb-1">
                      {detailItem.contentType === 'PHOTO' ? 'Photo Caption & Story' : detailItem.contentType === 'PROJECT' ? 'Executive Summary' : 'Article Abstract'}
                    </div>
                    <p className="text-slate-200 leading-relaxed">{detailItem.summaryOrCaption}</p>
                  </div>

                  {(detailItem.liveUrl || detailItem.repoUrl) && (
                    <div className="flex flex-wrap gap-3">
                      {detailItem.liveUrl && (
                        <div className="px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-mono text-emerald-300">
                          {detailItem.contentType === 'PHOTO' ? '📍 Location: ' : detailItem.contentType === 'BLOG' ? '⏱ Reading Time: ' : '🚀 Live URL: '}
                          {detailItem.liveUrl}
                        </div>
                      )}
                      {detailItem.repoUrl && (
                        <div className="px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-xs font-mono text-cyan-300">
                          {detailItem.contentType === 'PHOTO' ? '📷 Camera/EXIF: ' : '💻 Source / Canonical: '}
                          {detailItem.repoUrl}
                        </div>
                      )}
                    </div>
                  )}

                  <MarkdownBlocks markdown={detailItem.bodyMarkdown} />

                  <div className="flex flex-wrap gap-2 pt-4 border-t border-slate-800">
                    {(detailItem.tags || []).map((t, i) => (
                      <span key={i} className="px-3 py-1 rounded-lg bg-slate-900 border border-slate-800 text-xs font-mono text-cyan-400">
                        #{t}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            ) : activeNav === 'ADMIN' ? (
              !isAdminUnlocked ? (
                <div className="max-w-md mx-auto my-12 p-8 rounded-3xl bg-[#111827] border border-emerald-500/40 shadow-2xl text-center space-y-5">
                  <div className="w-14 h-14 rounded-2xl bg-emerald-500/15 border border-emerald-500/40 flex items-center justify-center mx-auto text-emerald-400 font-mono font-bold text-xl">
                    🔒
                  </div>
                  <h2 className="text-2xl font-display font-bold">Admin Studio Security</h2>
                  <p className="text-sm text-slate-400">
                    Enter your admin passcode to manage dynamic categories, blog posts, photo uploads, project showcases, and GitHub Pages static exports.
                  </p>
                  <input
                    type="password"
                    value={pinInput}
                    onChange={(e) => setPinInput(e.target.value)}
                    placeholder="Enter Admin Passcode"
                    className="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-center font-mono text-white"
                  />
                  <button
                    onClick={() => {
                      if (pinInput.trim() === (siteConfig.adminPasscode || '2026')) {
                        setIsAdminUnlocked(true);
                        showToast('Admin Studio unlocked!');
                      } else {
                        showToast('Invalid PIN! Default PIN is ' + (siteConfig.adminPasscode || '2026'));
                      }
                    }}
                    className="w-full py-3 rounded-xl bg-emerald-500 text-slate-950 font-mono font-bold text-sm hover:bg-emerald-400 transition"
                  >
                    Unlock Admin Studio
                  </button>
                  <button
                    onClick={() => {
                      setPinInput(siteConfig.adminPasscode || '2026');
                      setIsAdminUnlocked(true);
                      showToast('Unlocked with default demo PIN (2026)');
                    }}
                    className="w-full py-2.5 rounded-xl bg-slate-800 text-slate-300 font-mono text-xs hover:bg-slate-700 transition"
                  >
                    Quick Auto-Fill & Unlock (PIN: {siteConfig.adminPasscode || '2026'})
                  </button>
                </div>
              ) : (
                <div className="space-y-6">
                  {/* Admin Top Control Bar */}
                  <div className="p-6 rounded-3xl bg-[#111827] border border-slate-800 flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <span className="text-xs font-mono text-emerald-400 uppercase font-bold">● Admin Studio Active</span>
                      <h2 className="text-2xl font-display font-bold">Content & Static Site Manager</h2>
                    </div>
                    <div className="flex flex-wrap gap-2">
                      <button
                        onClick={handleDownloadStaticBundle}
                        className="px-4 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-mono font-bold text-xs hover:bg-emerald-400"
                      >
                        ⬇ Export content-bundle.json
                      </button>
                      <button
                        onClick={() => setIsAdminUnlocked(false)}
                        className="px-4 py-2.5 rounded-xl bg-slate-800 text-slate-300 font-mono text-xs hover:bg-slate-700"
                      >
                        Lock Session
                      </button>
                    </div>

                            )}
                          </div>
                          <div className="absolute bottom-3 left-3 right-3 flex justify-between items-center text-xs font-mono">
                            <span className="px-2.5 py-1 rounded-lg bg-slate-950/75 text-cyan-300 border border-cyan-500/30">
                              {item.categoryName}
                            </span>
                            <span className="text-slate-200 text-[11px] truncate max-w-[140px]">
                              {(item.liveUrl || '').replace('https://', '')}
                            </span>
                          </div>
                        </div>

                        <div className="p-5 space-y-2.5">
                          <h3 className="text-lg font-display font-bold text-white group-hover:text-emerald-400 transition line-clamp-2">
                            {item.title}
                          </h3>
                          <p className="text-sm text-slate-300 line-clamp-3 leading-relaxed">
                            {item.summaryOrCaption}
                          </p>
                          <div className="flex flex-wrap gap-1.5 pt-1">
                            {(item.tags || []).slice(0, 3).map((tag, idx) => (
                              <span key={idx} className="px-2 py-0.5 rounded bg-slate-900 text-[11px] font-mono text-cyan-400">
                                #{tag}
                              </span>
                            ))}
                          </div>
                        </div>
                      </div>

                      <div className="px-5 py-3.5 border-t border-slate-800/80 flex items-center justify-between text-xs font-mono text-slate-400">
                        <span>{(item.publishedDateIso || '').slice(0, 10)}</span>
                        <button
                          onClick={(e) => handleLike(item.id, e)}
                          className="px-2.5 py-1 rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500/20 transition"
                        >
                          ♥ {item.likesCount || 0}
                        </button>
                      </div>
                    </article>
                  ))}
                </div>
              </div>
            )}
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800/80 py-6 mt-12 text-center text-xs font-mono text-slate-400">
            <div className="max-w-6xl mx-auto px-6 flex flex-wrap items-center justify-between gap-4">
              <span>© {new Date().getFullYear()} {siteConfig.siteTitle} • Built for GitHub Pages Static Hosting</span>
              <span>{siteConfig.location} • {siteConfig.email}</span>
            </div>
          </footer>

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-5 right-5 z-50 px-5 py-3 rounded-2xl bg-emerald-950 border border-emerald-400 text-emerald-200 text-xs font-mono shadow-2xl">
              ✓ {toastMsg}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<RaselDevBDWebsite />);
  </script>
</body>
</html>
